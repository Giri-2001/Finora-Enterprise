<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="FINORA Enterprise - Private Finance Management Platform"
    />

    <title>FINORA Enterprise</title>

    <style>
      /* =======================================================
         FINORA ENTERPRISE OS™

         GLOBAL VIEWPORT RESET

         RESPONSIBILITY:

         - Remove browser default body margin
         - Establish exact viewport dimensions
         - Allow #root to occupy the complete application area
         - Prevent browser-level scrolling
         - Let AppShell own application scrolling
      ======================================================= */

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        overflow: hidden;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-width: 0;
        min-height: 0;
      }

      #root {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/app/renderer/v2/main.tsx"
    ></script>
  </body>
</html>
